services:
  moto:
    image: motoserver/moto:5.0.28
    ports: ["5000:5000"]
    command: moto_server -H 0.0.0.0 -p 5000
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment: &platform_env
      MOTO_ENDPOINT: http://moto:5000
      AWS_ACCESS_KEY_ID: testing
      AWS_SECRET_ACCESS_KEY: testing
      TENANT_KEYS: '{"demo-key-a":"retailer-a","demo-key-b":"retailer-b"}'
    ports: ["8000:8000"]
    depends_on: [moto]
  worker:
    build: .
    command: python -m worker.worker
    environment: *platform_env
    depends_on: [moto]
