name: Build Test and Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    env:
      ALICLOUD_REGION: cn-hangzhou
      PYTHONPATH: ${{ github.workspace }}
      ALICLOUD_ACCESS_KEY: ${{ secrets.ALICLOUD_ACCESS_KEY }}
      ALICLOUD_SECRET_KEY: ${{ secrets.ALICLOUD_SECRET_KEY }}
      TF_VAR_tenant_keys_json: ${{ secrets.TENANT_KEYS_JSON }}
      TF_VAR_runtime_access_key: ${{ secrets.ALICLOUD_ACCESS_KEY }}
      TF_VAR_runtime_access_secret: ${{ secrets.ALICLOUD_SECRET_KEY }}
      TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: pip install -r requirements.txt && pytest -q
      - run: mkdir -p dist/package && pip install -r requirements.txt --target dist/package && cp -r app worker dist/package/
      - uses: hashicorp/setup-terraform@v3
      - run: |
          terraform -chdir=infra init -backend-config="bucket=${TF_STATE_BUCKET}" -backend-config="key=terraform/inventory-platform.tfstate" -backend-config="encrypt=true"
          terraform -chdir=infra state show alicloud_ots_instance.inventory >/dev/null 2>&1 || terraform -chdir=infra import alicloud_ots_instance.inventory invplatots
          terraform -chdir=infra state show alicloud_mns_topic.events >/dev/null 2>&1 || terraform -chdir=infra import alicloud_mns_topic.events inventory-platform-events
          terraform -chdir=infra state show alicloud_ram_role.fc >/dev/null 2>&1 || terraform -chdir=infra import alicloud_ram_role.fc inventory-platform-fc-role
          terraform -chdir=infra apply -auto-approve
